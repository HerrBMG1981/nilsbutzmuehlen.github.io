<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Total Power in Motion | Nils Butzmühlen</title>

<meta name="description"
content="Industrial Battery Solutions für Material Handling, Automation und Energiespeicher.">

<meta property="og:type" content="website">
<meta property="og:title" content="Total Power in Motion | Nils Butzmühlen">
<meta property="og:description"
content="Industrial Battery Solutions für Material Handling, Automation und Energiespeicher.">

<meta property="og:image"
content="images/linkedin-preview.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
 --primary:#002B5C;
 --secondary:#E30613;
 --light:#F5F7FA;
 --text:#2d3748;
}

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 font-family:Segoe UI,Arial,sans-serif;
 background:#ffffff;
 color:var(--text);
 line-height:1.6;
}

header{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 background:white;
 z-index:1000;
 box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.navbar{
 max-width:1400px;
 margin:auto;
 padding:15px 25px;
 display:flex;
 justify-content:flex-start;
 align-items:center;
}

.logo{
 height:70px;
 width:auto;
}

.nav-links{
 display:flex;
 gap:25px;
 align-items:center;
}

.nav-links a{
 text-decoration:none;
 color:var(--primary);
 font-weight:600;
}

.booking-btn{
 background:var(--secondary);
 color:white !important;
 padding:12px 20px;
 border-radius:8px;
 text-decoration:none;
}

.hero{
 background:
 linear-gradient(rgba(0,43,92,.78),
 rgba(0,43,92,.78)),
 url("images/hero-background.jpg");

 background-size:cover;
 background-position:center;

 min-height:100vh;

 display:flex;
 align-items:center;
 justify-content:center;

 padding:140px 20px 80px;
}

.hero-content{

 max-width:1200px;
 width:100%;

 display:grid;
 grid-template-columns:350px 1fr;

 gap:60px;

 align-items:center;
}

.profile-card{

 background:white;
 padding:30px;
 border-radius:18px;
 text-align:center;

 box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.profile{
 width:220px;
 height:220px;
 object-fit:cover;
 border-radius:50%;
 border:5px solid var(--secondary);
}

.profile-card h3{
 margin-top:20px;
 color:var(--primary);
}

.profile-card p{
 color:#666;
}

.hero-text{
 color:white;
}

.hero-text h1{

 font-size:4rem;
 line-height:1.1;
 margin-bottom:20px;
}

.hero-text p{

 font-size:1.2rem;
 max-width:700px;
 margin-bottom:30px;
}

.hero-buttons{

 display:flex;
 gap:15px;
 flex-wrap:wrap;
}

.btn{

 display:inline-block;
 text-decoration:none;

 padding:15px 25px;
 border-radius:8px;
 font-weight:700;
}

.btn-primary{
 background:var(--secondary);
 color:white;
}

.btn-secondary{
 border:2px solid white;
 color:white;
}

section{
 padding:80px 20px;
}

.container{
 max-width:1200px;
 margin:auto;
}

.section-title{
 text-align:center;
 margin-bottom:50px;
 color:var(--primary);
}

.features{

 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:25px;
}

.feature-card{

 background:white;
 padding:30px;
 border-radius:16px;

 box-shadow:0 4px 12px rgba(0,0,0,.08);

 text-align:center;
}

.feature-icon{
 font-size:3rem;
 margin-bottom:15px;
}

@media(max-width:768px){

 .navbar{
  padding:15px;
 }

 .nav-links{
  display:none;
 }

 .hero-content{
  grid-template-columns:1fr;
 }

 .hero-text h1{
  font-size:2.2rem;
 }

 .profile{
  width:180px;
  height:180px;
 }

 .features{
  grid-template-columns:1fr;
 }

}

</style>

</head>

<body>

<header>

 <div class="nav-links">
  
 </div>

 </div>

</header>

<section class="hero">

 <div class="hero-content">

  <div class="profile-card">

   <img
    src="images/nils-butzmuehlen.jpg"
    alt="Profilbild"
    class="profile">

   <h3>Nils Butzmühlen</h3>

   <p>Sales Representative IMS</p>

  </div>

  <div class="hero-text">

   <h1>
    TOTAL POWER<br>
    IN MOTION
   </h1>

   <p>

     Energielösungen für Material Handling,
     Automation, Energiespeicher und
     Ladeinfrastruktur.

   </p>

   <div class="hero-buttons">

     <a href="#battery-request"
        class="btn btn-primary">

        🔋 Batterieanfrage

     </a>

     <a href="pdf/Total-Power-in-Motion.pdf"
        download
        class="btn btn-secondary">

        ⚡ Produktportfolio

     </a>

     <a href="#BOOKINGS_LINK"
        class="btn btn-secondary">

        📅 Termin vereinbaren

     </a>

   </div>

  </div>

 </div>

</section>
